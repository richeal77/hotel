openapi: 3.0.3
info:
  title: Gaobeidian Shangkeyou Miniapp API
  version: 0.4.0-draft
  description: Phase 3 room pricing and benefits draft contract. New operations are planned, not implemented. SMS delivery outside local-demo remains planned.
servers:
  - url: http://localhost:8080/api/v1
    description: Local demo on development computer
  - url: http://{lanIp}:8080/api/v1
    description: Phone preview on the same Wi-Fi
    variables:
      lanIp:
        default: 192.168.1.100
security:
  - memberBearerAuth: []
  - staffBearerAuth: []
tags:
  - name: Auth
  - name: Miniapp
  - name: Admin
  - name: Demo
paths:
  /auth/mock-login:
    post:
      tags: [Auth]
      summary: Mock miniapp login
      description: Available only in local-demo. Must be disabled in integration and production.
      x-environments: [local-demo]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockLoginRequest"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member_token, member]
                        properties:
                          member_token:
                            type: string
                            example: mock_member_token
                          member:
                            $ref: "#/components/schemas/MemberAuthProfile"
  /auth/wx-login:
    post:
      tags: [Auth]
      summary: Log in with a WeChat login code
      description: Exchange the short-lived wx.login code on the server; never send an app secret to the client.
      x-environments: [integration, production]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WxLoginRequest"
      responses:
        "200":
          description: Member session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member_token, member]
                        properties:
                          member_token:
                            type: string
                          member:
                            $ref: "#/components/schemas/MemberAuthProfile"
  /auth/send-code:
    post:
      tags: [Auth]
      summary: Send phone verification code
      description: Local-demo returns mock_code. Live SMS delivery is reserved in this contract but unavailable until a provider is integrated.
      x-environments: [local-demo]
      x-planned-environments: [integration, production]
      x-implementation-status: live-sms-planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "200":
          description: Verification code dispatch result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/DemoSendCodeData"
                          - $ref: "#/components/schemas/LiveSendCodeData"
  /auth/bind-phone:
    post:
      tags: [Auth]
      summary: Bind member phone with an SMS code
      description: Local-demo accepts code 666666. Live SMS verification is unavailable until a provider is integrated.
      x-environments: [local-demo]
      x-planned-environments: [integration, production]
      x-implementation-status: live-sms-planned
      security:
        - memberBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindPhoneRequest"
      responses:
        "200":
          description: Bound member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member]
                        properties:
                          member:
                            $ref: "#/components/schemas/MemberAuthProfile"
  /auth/wx-bind-phone:
    post:
      tags: [Auth]
      summary: Bind member phone using WeChat phone authorization
      description: The server exchanges the short-lived phone code obtained from wx.getPhoneNumber.
      x-environments: [integration, production]
      security:
        - memberBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WxBindPhoneRequest"
      responses:
        "200":
          description: Bound member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member]
                        properties:
                          member:
                            $ref: "#/components/schemas/MemberAuthProfile"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current member session
      x-environments: [integration, production]
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /members/join:
    post:
      tags: [Miniapp]
      summary: Local-demo legacy membership join
      description: Local JSON demo only. Integration and production reject this legacy gift-issuing write with 409 FEATURE_DISABLED; use /members/configured-join when CONFIGURED_JOIN_ENABLED is on. Turning that switch off never re-enables this route.
      x-environments: [local-demo]
      security:
        - memberBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMemberRequest"
      responses:
        "200":
          description: Joined member and issued gift coupons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member, issued_coupons]
                        properties:
                          member:
                            $ref: "#/components/schemas/Member"
                          issued_coupons:
                            type: array
                            items:
                              $ref: "#/components/schemas/CouponSummary"
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /mini/home:
    get:
      tags: [Miniapp]
      summary: Miniapp home data
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Home data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MiniHome"
  /members/me:
    get:
      tags: [Miniapp]
      summary: Current member profile
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member]
                        properties:
                          member:
                            $ref: "#/components/schemas/Member"
                          member_code:
                            type: string
                            example: mbr_001
  /coupons/my:
    get:
      tags: [Miniapp]
      summary: Current member coupons
      security:
        - memberBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponStatusQuery"
      responses:
        "200":
          description: Coupon list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Coupon"
  /wallet/me:
    get:
      tags: [Miniapp]
      summary: Current member wallet
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Wallet account and ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WalletAccount"
  /bookings:
    post:
      tags: [Miniapp]
      summary: Local-demo legacy booking intent
      description: Local JSON demo only. Integration and production reject this legacy fixed-price write with 409 FEATURE_DISABLED; use quote plus /bookings/configured when CONFIGURED_BOOKING_ENABLED is on. Turning that switch off never re-enables this route.
      x-environments: [local-demo]
      security:
        - memberBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "200":
          description: Created booking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order:
                            $ref: "#/components/schemas/BookingOrderSummary"
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /bookings/my:
    get:
      tags: [Miniapp]
      summary: Current member bookings
      description: Local-demo returns legacy BookingOrder items; integration and production return only ConfiguredOrder items. Demo seed orders are never imported into production.
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Booking list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              oneOf:
                                - $ref: "#/components/schemas/BookingOrder"
                                - $ref: "#/components/schemas/ConfiguredOrder"
  /referrals/me:
    get:
      tags: [Miniapp]
      summary: Current member referral page
      security:
        - memberBearerAuth: []
      responses:
        "200":
          description: Referral data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReferralPage"
  /referrals/bind:
    post:
      tags: [Miniapp]
      summary: Bind direct referrer
      security:
        - memberBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referrer_member_id]
              properties:
                referrer_member_id:
                  type: string
                  example: mbr_001
      responses:
        "200":
          description: Bound referral relation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [relation]
                        properties:
                          relation:
                            $ref: "#/components/schemas/ReferralRelation"
  /admin/auth/login:
    post:
      tags: [Admin]
      summary: Staff login
      description: Local-demo uses the documented demo password. Integration and production use separately provisioned credentials and server-side password verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Staff login result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [access_token, staff]
                        properties:
                          access_token:
                            type: string
                          staff:
                            $ref: "#/components/schemas/StaffUser"
  /admin/auth/logout:
    post:
      tags: [Admin]
      summary: Revoke the current staff session
      x-environments: [integration, production]
      security:
        - staffBearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: Owner dashboard summary
      security:
        - staffBearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-09-12"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardSummary"
  /admin/bookings:
    get:
      tags: [Admin]
      summary: Admin booking list
      description: Local-demo uses legacy statuses and BookingOrder items; integration and production use booked/checked_in/cancelled/no_show and ConfiguredOrder items only. Closing new booking does not block processing already submitted configured orders.
      security:
        - staffBearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending_confirm, confirmed, booked, checked_in, checked_out, cancelled, no_show] }
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paged bookings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  oneOf:
                                    - $ref: "#/components/schemas/BookingOrder"
                                    - $ref: "#/components/schemas/ConfiguredOrder"
  /admin/bookings/{order_id}/status:
    patch:
      tags: [Admin]
      summary: Update local-demo booking status
      description: Local JSON demo only. Integration and production reject this legacy status writer with 409 FEATURE_DISABLED; configured orders use /admin/bookings/{id}/configured-status.
      x-environments: [local-demo]
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order:
                            $ref: "#/components/schemas/BookingOrder"
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /admin/members:
    get:
      tags: [Admin]
      summary: Admin member search
      security:
        - staffBearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            example: "13800138001"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paged members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Member"
  /admin/members/{member_id}/status:
    patch:
      tags: [Admin]
      summary: Update member status
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberStatusRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [member]
                        properties:
                          member:
                            $ref: "#/components/schemas/Member"
  /admin/redemption/lookup:
    get:
      tags: [Admin]
      summary: Lookup member redemption data
      security:
        - staffBearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            example: "13800138001"
      responses:
        "200":
          description: Redemption lookup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RedemptionLookup"
  /admin/coupons/{coupon_id}/redeem:
    post:
      tags: [Admin]
      summary: Redeem coupon
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCouponRequest"
      responses:
        "200":
          description: Redeemed coupon
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [coupon]
                        properties:
                          coupon:
                            $ref: "#/components/schemas/Coupon"
  /admin/wallets/{member_id}/adjust:
    post:
      tags: [Admin]
      summary: Manually adjust wallet
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustWalletRequest"
      responses:
        "200":
          description: Wallet adjustment result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [wallet, ledger]
                        properties:
                          wallet:
                            $ref: "#/components/schemas/WalletAccount"
                          ledger:
                            $ref: "#/components/schemas/WalletLedger"
  /admin/referrals/rewards:
    get:
      tags: [Admin]
      summary: Referral rewards list
      security:
        - staffBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RewardStatus"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paged referral rewards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ReferralReward"
  /admin/rules:
    get:
      tags: [Admin]
      summary: Get demo rule config
      security:
        - staffBearerAuth: []
      responses:
        "200":
          description: Rule config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuleConfig"
    patch:
      tags: [Admin]
      summary: Update demo rule config
      security:
        - staffBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleConfig"
      responses:
        "200":
          description: Updated rule config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuleConfig"
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit log list
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Paged audit logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/AuditLog"
  /admin/demo/state:
    get:
      tags: [Demo]
      summary: Get demo state
      description: Available only in local-demo.
      x-environments: [local-demo]
      security:
        - staffBearerAuth: []
      responses:
        "200":
          description: Demo state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DemoState"
  /admin/demo/reset:
    post:
      tags: [Demo]
      summary: Reset demo data
      description: Available only in local-demo.
      x-environments: [local-demo]
      security:
        - staffBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_text]
              properties:
                confirm_text:
                  type: string
                  enum: [RESET]
      responses:
        "200":
          description: Demo reset result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DemoState"
  /mini/capabilities:
    get:
      tags: [Miniapp]
      summary: Published feature switches
      security: []
      x-implementation-status: planned
      responses:
        "200": { $ref: "#/components/responses/CapabilitiesOK" }
  /mini/room-types:
    get:
      tags: [Miniapp]
      summary: Available rooms and rates for a stay
      security: []
      x-implementation-status: planned
      parameters:
        - { name: checkin_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkout_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/RoomSearchOK" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /bookings/quotes:
    post:
      tags: [Miniapp]
      summary: Create a single-use room quote
      x-implementation-status: planned
      security: [{ memberBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuoteRequest" } } } }
      responses:
        "200": { description: Quote, content: { application/json: { schema: { $ref: "#/components/schemas/QuoteResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bookings/configured:
    post:
      tags: [Miniapp]
      summary: Book one room using a quote; verified member phone required
      x-implementation-status: planned
      security: [{ memberBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubmitConfiguredBooking" } } } }
      responses:
        "200": { description: Booked order, content: { application/json: { schema: { $ref: "#/components/schemas/ConfiguredOrderResponse" } } } }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bookings/{id}/cancel:
    post:
      tags: [Miniapp]
      summary: Cancel own booked order and release nightly holds
      x-implementation-status: planned
      security: [{ memberBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
