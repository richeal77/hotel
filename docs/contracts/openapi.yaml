        "503": { $ref: "#/components/responses/AuditUnavailable" }
components:
  responses:
    ValidationError: { description: Field validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 40000, message: Invalid request, data: { reason: VALIDATION_ERROR, field_errors: [{ field: checkin_date, message: Required }] } } } } }
    Unauthenticated: { description: Missing or expired member/staff session, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 40100, message: Login required, data: { reason: UNAUTHENTICATED } } } } }
    Forbidden: { description: Authenticated actor cannot perform this operation, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 40300, message: Forbidden, data: { reason: FORBIDDEN } } } } }
    NotFound: { description: Resource not found or not owned by caller, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 40400, message: Not found, data: { reason: NOT_FOUND } } } } }
    BusinessConflict: { description: State or version conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 40900, message: Refresh and retry, data: { reason: ROOM_SOLD_OUT } } } } }
    AuditUnavailable: { description: Candidate D7 policy only; production decision pending, content: { application/json: { schema: { $ref: "#/components/schemas/Phase3Error" }, example: { code: 50300, message: Audit unavailable, data: { reason: AUDIT_UNAVAILABLE } } } } }
    CapabilitiesOK: { description: Switches visible to the client, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilitiesResponse" }, example: { code: 0, message: ok, data: { configured_booking: false, campaign_issue: false, configured_join: false } } } } }
    RoomSearchOK: { description: Available rooms, content: { application/json: { schema: { $ref: "#/components/schemas/RoomSearchResponse" } } } }
  securitySchemes:
    memberBearerAuth:
      type: http
      scheme: bearer
      description: Opaque, revocable session token in integration and production; mock token in local-demo.
    staffBearerAuth:
      type: http
      scheme: bearer
      description: Opaque, revocable session token in integration and production; mock token in local-demo.
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid }, description: Same actor, operation and normalized body replay the original response for seven days. }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    FromDate: { name: from, in: query, required: false, schema: { type: string, format: date } }
    ToDate: { name: to, in: query, required: false, schema: { type: string, format: date } }
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CouponStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CouponStatus"
    BookingStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/BookingStatus"
    MemberIdPath:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        example: mbr_001
    OrderIdPath:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        example: ord_001
    CouponIdPath:
      name: coupon_id
      in: path
      required: true
      schema:
        type: string
        example: cpn_001
  schemas:
    ApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
